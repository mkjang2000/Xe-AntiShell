# Fixed monitor-only policy, reviewed against Tetragon v1.8.0.
# Both credentials are copied at entry; return0 confirms commit_creds applied.
# Five entry slots is Tetragon's limit. The return argument is a separate slot.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: xeas-credential-change-v1
spec:
  options:
    - name: policy-mode
      value: monitor
  kprobes:
    - call: commit_creds
      syscall: false
      return: true
      args:
        - index: 0
          type: cred
          label: after
      data:
        - index: 0
          type: cred
          source: current_task
          resolve: cred
          label: before
        - index: 1
          type: int
          source: current_task
          resolve: pid
          label: tid
        - index: 2
          type: uint64
          source: current_task
          resolve: start_time
          label: task_start
        - index: 3
          type: int
          source: current_task
          resolve: tgid
          label: tgid
      returnArg:
        index: 0
        type: int
        label: result
      selectors:
        - matchActions:
            - action: Post
