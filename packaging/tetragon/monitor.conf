# Host-admin override for the official Tetragon v1.8 standalone unit.
# Install as /etc/systemd/system/tetragon.service.d/monitor.conf after reviewing
# the official release archive. No tracing/enforcement policies are installed.
[Service]
ExecStart=
ExecStart=/usr/local/bin/tetragon --server-address=unix:///run/tetragon/tetragon.sock --export-filename= --health-server-address=127.0.0.1:6789 --metrics-server=127.0.0.1:2112 --enable-k8s-api=false --enable-process-cred=true --enable-process-environment-variables=false --enable-ancestors=base --process-cache-size=32768
UMask=0077
