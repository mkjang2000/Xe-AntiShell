version: 1

# Acts only after enrollment on a supported RPM/systemd installation.
# Set false to refuse new remote updates; prior results still report to central.
updates:
  enabled: true

agent:
  id: ""
  socket_path: /run/xe-antishell/sentineld.sock
  database_path: /var/lib/xe-antishell/sentineld.db

collector:
  mode: auto
  tetragon:
    command: /usr/bin/tetra
    args:
      - getevents
      - -o
      - json
  audit:
    input_path: ""
    # Empty keeps every normalized exec event. Production monitor policies can
    # list exact basenames (for example sh and bash) to bound local storage.
    include_executables: []
    # When true, audit events are retained only when their live service or
    # executable ancestry matches detection.web_services/web_executables.
    only_detection_origins: false
  replay:
    path: ""

limits:
  max_event_bytes: 262144
  max_raw_json_bytes: 131072
  max_argv: 128
  max_argument_bytes: 4096
  queue_size: 256
  query_default: 100
  query_maximum: 1000
  retention_days: 7
  observation_history_minutes: 60

privacy:
  store_raw_events: false
  redact_argv: true
  sensitive_argument_names:
    - password
    - passwd
    - token
    - access-token
    - api-key
    - apikey
    - secret
    - client-secret
    - authorization

detection:
  enabled: true
  extended_process_rules: false
  # Optional global root execution + paired commit_creds observation.
  # Requires the reviewed unfiltered Tetragon JSON/Unix source on a packaged host.
  # Default suspicious alerts retain all root exec evidence but alert on context.
  # root_exec_alerts may be suspicious or all only while privilege_rules is true.
  privilege_rules: false
  web_executables:
    - httpd
    - apache2
    - nginx
    - php-fpm
    - gunicorn
    - uwsgi
  web_services: []
  shells:
    - sh
    - bash
    - dash
    - zsh
    - ksh
    - ash
  allowed_pairs: []

# Host-local scopes for detection-only file and TCP alerts. Each service must
# also be explicitly named by the active policy in detection.web_services.
service_observations: []

response:
  allow_terminate: false
